<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screening Room — Anime & Movie Matcher</title>
  <meta name="theme-color" content="#141117">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <button class="navbar-title-btn" id="navbar-home-btn">🎬 Screening Room</button>
      <div class="navbar-actions">
        <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
        <button class="icon-btn" id="nav-history-btn" aria-label="View history">🕘</button>
        <button class="icon-btn" id="nav-saved-btn" aria-label="View saved">★<span class="badge"
            id="saved-badge"></span></button>
      </div>
    </div>
    <div class="stepper" id="stepper"></div>
  </header>

  <main class="app">
    <div id="screen" aria-live="polite"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
